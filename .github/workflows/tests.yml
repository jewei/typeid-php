name: tests

on:
  push:
    # README.md and CONTEXT.md are read by the architecture check, so they are
    # deliberately not ignored here.
    paths-ignore:
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'
      - 'LICENSE'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            dependencies: lowest
            composer-args: --prefer-lowest
          - php: '8.4'
            dependencies: highest
            composer-args: ''
          - php: '8.5'
            dependencies: highest
            composer-args: ''

    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction ${{ matrix.composer-args }}

      - name: Check architecture
        run: composer test:architecture

      - name: Run tests
        run: composer test:unit

  coverage:
    runs-on: ubuntu-latest
    name: Code Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Enforce coverage
        run: vendor/bin/pest --coverage --min=90

  style:
    runs-on: ubuntu-latest
    name: Code Style

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Check code style
        run: vendor/bin/pint --test
